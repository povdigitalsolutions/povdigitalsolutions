<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#logoGrad)" opacity="0.95"/>
  <circle cx="50" cy="50" r="48" fill="none" stroke="url(#logoGrad)" stroke-width="2" opacity="0.5"/>
  
  <!-- P -->
  <text x="30" y="65" font-size="48" font-weight="bold" fill="white" font-family="Arial, sans-serif">P</text>
  <!-- O -->
  <text x="50" y="65" font-size="48" font-weight="bold" fill="white" font-family="Arial, sans-serif">O</text>
  <!-- V -->
  <text x="70" y="65" font-size="48" font-weight="bold" fill="white" font-family="Arial, sans-serif">V</text>
</svg>